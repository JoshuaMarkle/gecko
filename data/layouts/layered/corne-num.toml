name = "Colemak-DH + numpad/nav layer"
geometry = "corne-36"
source = "GECKO start layout for digits and arrows: corne-code's base and symbol layer; layer 2 has a Miryoku-like numpad on the left hand (0 on the left thumb) and Vim-style arrows on the right home row"
# Base thumbs: Esc Space [hold layer 1] | Enter Backspace [hold layer 2].
# A layer's keys on the finger that holds it are unusable (written ·).
rows = ['qwfpbjluy;', 'arstgmneio', 'zxcdvkh,./', '{esc}{space}{layer1}{enter}{bspc}{layer2}']

[[layer]]
name = "sym"
rows = ['!@#$%^&*~`', '{}()=+_?:"', '[]<>|\····', '······']

[[layer]]
name = "num"
rows = ['·789······', '·456·{left}{down}{up}{right}·', '·123······', '·0····']
