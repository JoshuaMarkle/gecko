name = "Colemak-DH + number-row/nav layer"
geometry = "corne-36"
source = "GECKO comparison for corne-num: the same layers, but the digits in a row across the home row (as in corne-code) and the arrows on the right top row"
# Base thumbs: Esc Space [hold layer 1] | Enter Backspace [hold layer 2].
# A layer's keys on the finger that holds it are unusable (written ·).
rows = ['qwfpbjluy;', 'arstgmneio', 'zxcdvkh,./', '{esc}{space}{layer1}{enter}{bspc}{layer2}']

[[layer]]
name = "sym"
rows = ['!@#$%^&*~`', '{}()=+_?:"', '[]<>|\····', '······']

[[layer]]
name = "num"
rows = ['·····{left}{down}{up}{right}·', '1234567890', '··········', '······']
