name = "my-hand"
description = "Example for context/build-guide.md: the hand profile with one measured hand (205 mm long, 88 mm palm). Copy it and put in your own measurements."
scale_basis = "stdev over 9 layouts (canary, colemak, colemak-dh, dvorak, graphite, halmak, semimak, sturdy, workman) on english / ansi-30"

# Target % per finger: LP LR LM LI LT RT RI RM RR RP
finger_target = [8.0, 11.0, 15.0, 16.0, 0.0, 0.0, 16.0, 15.0, 11.0, 8.0]

# `effort` added off the home row per finger (pinky ring middle index), [above, below] home.
# KLO's key costs: the top row is easy for middle/ring, the bottom row easy for index.
row_offset = [[0.0, 0.0], [-0.1, 0.1], [-0.2, 0.2], [0.2, -0.2]]

# Weights and scales: the default profile's (see data/profiles/default.toml for what they mean),
# plus the terms below.
# Hand for reach/wrist/press_angle and stretch's relaxed spread: size = "small" | "average" | "large", or explicit
# [hand.dims] in mm (thumb, index, middle, ring, pinky segments; palm_width, palm_length, span,
# reach), as the web's Hand tab edits them. Optional [hand.body] elbow_width / forearm (mm) for
# wrist; default scaled with the hand (465 / 255 for average). context/hand-model.md.
[hand]
# One measured hand, mm (context/build-guide.md, step 1). Segments base -> tip.
[hand.dims]
thumb = [48, 33, 24]
index = [42, 24, 19]
middle = [47, 28, 20]
ring = [44, 27, 20]
pinky = [35, 19, 18]
palm_width = 88
palm_length = 110
span = 209
reach = 42

# Build limits (context/geometry.md, G07): the defaults, plus a case check so the search rejects
# boards whose MX keycaps would hit the printed case.
[build]
case = "mx"

[weights]
sfb = 2.867             # SFB %; the strongest timing effect (+0.55 median keystroke interval)
sfs = 0.5139            # SFS %, one key between; no measured timing cost, kept as a comfort assumption
sfs_far = 0.1811        # far SFS %, 2–3 keys between (decayed); same per-% weight as sfs
stretch = 0.5313        # geometric stretch (LSB, scissors, crossings)
movement = 0.2478       # finger-pair movement (KLO table + ring coupling)
skip_stretch = 0.08195  # skip stretch (stretch on keys 1–3 of a trigram)
scissor = 0.4047        # full scissors: measured +0.10 interval on top of the row jump
half_scissor = 0.2704   # half scissors
pinky_ring = 1.255      # pinky–ring pairs: measured +0.13 interval
row_jump = 0.3684       # same-hand row jump: timing and Engram comfort both track it
effort = 0.0817         # key effort, halved: reach carries reach, effort keeps finger strength
home_row = 0.1094       # home row share
finger_target = 0.06071 # finger load error (mean squared %)
hand_balance = 0.08906  # hand balance
alternate = 0.5493      # alternates
inroll = 0.3143         # rolls in
outroll = 0.6058        # rolls out (in and out measure equally fast)
redirect = 0.4007       # redirects
bad_redirect = 0.2598   # bad redirects (+3.8% third-keystroke time)
engram = 0.6217         # measured key-pair discomfort (Engram)
reach = 0.4272          # hand-model reach
press_angle = 0.3056    # hand-model press angle; mostly separates boards, mild on flat ones
wrist = 1.0             # wrist posture, NATURAL units (no scale): a board metric (ANSI 2.1, split 1.7,
              # tented 1.0); its spread over layouts on one board is ~0.002, so it barely moves search

[scale]
sfb = 0.7908
sfs = 1.209
sfs_far = 0.4285
stretch = 1.316
movement = 18.14
skip_stretch = 1.341
scissor = 0.5297
half_scissor = 0.6859
pinky_ring = 0.9029
row_jump = 3.366
effort = 0.03799
home_row = 3.573
finger_target = 2.018
hand_balance = 1.789
alternate = 5.475
inroll = 2.119
outroll = 4.039
redirect = 2.672
bad_redirect = 0.6505
engram = 1.206
reach = 0.08472
press_angle = 0.03651
