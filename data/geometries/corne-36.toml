name = "corne-36"
description = "Corne (crkbd) 3x5+3: 36-key column-staggered split with three thumb keys per hand."
# Units: 1u = 19.05 mm. x right, y toward the user (top of the middle column = 0), z up.
# Keys are listed row by row; layout rows map onto them in this order.
# effort: base cost per press (lower is easier); alpha keys reuse ortho-30's values.
# fill: what a key gets when a layout lists only the 30 alpha keys (see context/representation.md).
# Column stagger and thumb positions approximate the crkbd KLE without the outer pinky column.
# Thumb fills follow Miryoku: Esc Space Tab | Enter Backspace (none).

