name = "ansi-30-angle"
description = "ansi-30 with the angle mod: the left bottom row is typed one finger over (Z ring, X middle, C V B index)."
# Units: 1u = 19.05 mm. x right, y toward the user (top row = 0), z up.
# Keys are listed row by row; layout rows map onto them in this order.
# effort: base cost per press (lower is easier), carpalx/Oxeylyzer-style.
# Angle mod: same key positions as ansi-30; the wrist turns so each left finger takes the
# bottom key one column left of its standard one, and the pinky has no bottom key. Each
# re-fingered key takes the effort its finger has on its natural bottom key in ansi-30
# (ring 2.8, middle 2.4, index 1.8); V, one key inward of the index's natural C, takes
# the effort of the mirrored right-hand N (2.6). See context/decisions/scoring.md.

# Key-pair comfort tables in data/comfort/ for the comfort metrics.
[comfort]
engram_formula = "engram-2key" # Engram's hand-built formula
engram = "engram-bt"           # fitted from Engram's raw pairwise choices

