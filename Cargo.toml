[workspace]
resolver = "2"
members = ["crates/gecko-core", "crates/gecko-cli", "crates/gecko-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"

# Tuned for fast rebuilds during development (see context/decisions.md):
# incremental + many codegen units turn a one-line change from ~16 s into ~1.5 s.
# For maximum scorer speed on long runs use `--profile max`.
[profile.release]
opt-level = 3
lto = false
codegen-units = 256
incremental = true
debug = false

[profile.test]
opt-level = 3
lto = false
codegen-units = 256
incremental = true

[profile.max]
inherits = "release"
codegen-units = 1
lto = "fat"
incremental = false

[profile.release.package.gecko-wasm]
opt-level = "s"
