[workspace]
resolver = "2"
members = ["crates/gecko-core", "crates/gecko-cli", "crates/gecko-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.release.package.gecko-wasm]
opt-level = "s"
